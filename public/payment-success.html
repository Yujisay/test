<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful — Study Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: { primary: '#535C3B', secondary: '#E5D3B3', accent: '#C8A374', neutral: '#707070', dark: '#373737', light: '#FDFCFB', surface: '#FFFFFF', border: '#E8E2D9' } } } }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-brand-light font-['Inter'] flex items-center justify-center px-4">
  <div class="w-full max-w-sm text-center space-y-6">
    <div class="w-20 h-20 rounded-full bg-emerald-100 border-4 border-emerald-200 flex items-center justify-center mx-auto">
      <i data-lucide="check-circle-2" class="w-10 h-10 text-emerald-600"></i>
    </div>
    <div>
      <h1 class="text-2xl font-extrabold font-['Outfit'] text-brand-dark">Payment Successful!</h1>
      <p class="text-sm text-brand-neutral mt-2 leading-relaxed">Your WiFi session has been paid. Please proceed to the Study Hub cashier to activate your session.</p>
    </div>
    <div class="bg-brand-surface border border-brand-border rounded-2xl p-5 space-y-3 text-sm text-left">
      <div class="flex justify-between">
        <span class="text-brand-neutral">Reference No.</span>
        <span id="refNum" class="font-bold font-mono text-brand-primary">—</span>
      </div>
      <div class="flex justify-between">
        <span class="text-brand-neutral">Status</span>
        <span class="font-bold text-emerald-600 uppercase text-xs bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200" id="statusBadge">Checking...</span>
      </div>
    </div>
    <div class="p-4 bg-amber-50 border border-amber-100 rounded-xl text-xs text-amber-700 text-left flex items-start gap-2">
      <i data-lucide="info" class="w-4 h-4 mt-0.5 shrink-0"></i>
      <span>Show this page or your reference number to the cashier. Your WiFi will be activated once they confirm your seat.</span>
    </div>
    <a href="/" class="block w-full py-3.5 rounded-2xl bg-brand-primary text-white font-bold font-['Outfit'] text-sm hover:bg-brand-primary/90 transition-all">
      Back to Portal
    </a>
  </div>
  <script>
    if (window.lucide) lucide.createIcons();
    window.addEventListener('load', () => { if (window.lucide) lucide.createIcons(); });
    const params = new URLSearchParams(window.location.search);
    const ref = params.get('ref') || '—';
    document.getElementById('refNum').textContent = ref;
    if (ref !== '—') {
      fetch(`/api/payment-status/${ref}`)
        .then(r => r.json())
        .then(data => {
          const badge = document.getElementById('statusBadge');
          if (data.status === 'PENDING SESSION') {
            badge.textContent = 'PAID — PENDING ACTIVATION';
          } else if (data.status === 'ACTIVE') {
            badge.textContent = 'ACTIVE';
          } else {
            badge.textContent = data.status || 'PAID';
          }
        })
        .catch(() => { document.getElementById('statusBadge').textContent = 'PAID'; });
    }
  </script>
</body>
</html>
